  <!-- overlay kalau fullscreen otomatis diblokir -->

    <div style="text-align:center">
      <div style="font-size:1.2rem; margin-bottom:.5rem">Browser memblokir fullscreen otomatis.</div>

  <script>
    // Fungsi untuk mencoba masuk fullscreen
    async function tryEnterFullscreen() {
      const el = document.documentElement;
      if (el.requestFullscreen) {
        try {
          await el.requestFullscreen();
          // berhasil -> sembunyikan overlay kalau ada
          document.getElementById('overlay').style.display = 'none';
          return true;
        } catch (err) {
          return false;
        }
      } else if (el.webkitRequestFullscreen) { // Safari old
        try {
          el.webkitRequestFullscreen();
          document.getElementById('overlay').style.display = 'none';
          return true;
        } catch (err) {
          return false;
        }
      }
      return false;
    }

    // Coba otomatis saat halaman load (banyak browser akan tolak)
    window.addEventListener('load', async () => {
      const ok = await tryEnterFullscreen();
      if (!ok) {
        // tampilkan overlay instruksi agar user tap/klik
        const ov = document.getElementById('overlay');
        ov.style.display = 'flex';
      }
    });

    // tombol manual enter fullscreen (user gesture)
    document.getElementById('enterFs').addEventListener('click', async () => {
      await tryEnterFullscreen();
      document.getElementById('overlay').style.display = 'none';
    });

    // optional: cegah beberapa interaksi keyboard / klik kanan
    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
